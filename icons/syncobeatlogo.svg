<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC657"/>
      <stop offset="100%" stop-color="#F07A12"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E2008"/>
      <stop offset="100%" stop-color="#1A1408"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtitle Rim / Drum Head Rings -->
  <circle cx="256" cy="390" r="160" fill="none" stroke="#1A1408" stroke-opacity="0.12" stroke-width="8"/>
  <circle cx="256" cy="390" r="210" fill="none" stroke="#1A1408" stroke-opacity="0.06" stroke-width="4"/>

  <!-- Crossed Drumsticks (Background) -->
  <g transform="rotate(-30 256 390)">
    <path d="M 80 390 L 420 390" stroke="#1A1408" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8"/>
    <ellipse cx="72" cy="390" rx="12" ry="7" fill="#1A1408" opacity="0.8"/>
  </g>
  <g transform="rotate(30 256 390)">
    <path d="M 92 390 L 432 390" stroke="#1A1408" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8"/>
    <ellipse cx="440" cy="390" rx="12" ry="7" fill="#1A1408" opacity="0.8"/>
  </g>

  <!-- Metronome Frame Outer Edge -->
  <path d="M 210 110 L 302 110 L 350 390 L 162 390 Z" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="16" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>

  <!-- Subtly Integrated "S" + "B" Path inside Metronome Frame -->
  <!-- Upper Loop forms 'S', Lower Right Bumps complete the 'B' -->
  <path d="M 285 160 
           C 210 140, 195 210, 256 230 
           C 315 250, 290 325, 210 320
           M 256 230
           C 315 230, 320 270, 275 280
           C 325 285, 320 330, 250 330" 
        fill="none" 
        stroke="#1A1408" 
        stroke-opacity="0.35" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Tilted Pendulum Rod (Off-Beat Swing) -->
  <line x1="256" y1="370" x2="145" y2="130" stroke="#1A1408" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Pendulum Weight -->
  <rect x="150" y="160" width="36" height="28" rx="6" transform="rotate(25 168 174)" fill="url(#accentGrad)"/>

  <!-- Synco Beat Flare (Impact Burst) -->
  <circle cx="132" cy="105" r="10" fill="#1A1408" filter="url(#glow)"/>
  <line x1="120" y1="85" x2="105" y2="70" stroke="#1A1408" stroke-width="5" stroke-linecap="round"/>
  <line x1="145" y1="80" x2="148" y2="60" stroke="#1A1408" stroke-width="5" stroke-linecap="round"/>
  <line x1="105" y1="110" x2="85" y2="112" stroke="#1A1408" stroke-width="5" stroke-linecap="round"/>
</svg>
